name: Build Jerry APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Jerry project
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q JerryAssistant-v2.zip -d build-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Jerry APK
        working-directory: build-source/JerryAssistant
        run: gradle assembleDebug --stacktrace

      - name: Upload Jerry APK
        uses: actions/upload-artifact@v4
        with:
          name: Jerry-debug-apk
          path: build-source/JerryAssistant/app/build/outputs/apk/debug/app-debug.apk
